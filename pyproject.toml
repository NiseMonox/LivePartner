[project]
name = "livepartner"
version = "0.1.0"
description = "Desktop AI gaming companion — watches your screen, talks via Mumble"
readme = "SPEC.md"
requires-python = ">=3.11"
authors = [{ name = "NiseMono" }]

dependencies = [
    "python-dotenv>=1.0",
    "openai>=1.50",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "Pillow>=10.0",
    "edge-tts>=6.1",
    "PySide6>=6.7",
    # Audio pipeline (M1: Mumble bot)
    "pymumble>=1.6",
    "miniaudio>=1.7",      # mp3 decode + resample, no system ffmpeg needed
    "pyogg>=0.6.14a1",     # ships opus.dll on Windows so opuslib can find it
    "cryptography>=42",
]

[project.optional-dependencies]
# M1+ runtime modules; install on demand as we implement each.
capture = [
    "opencv-python>=4.10",
    "sounddevice>=0.5",
    "pygrabber>=0.2",
    "numpy>=1.26",
]
signals = [
    "scikit-image>=0.24",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Live 2D avatar via VTube Studio + pyvts. Optional — if VTS isn't installed
# or pyvts import fails, LivePartner runs unchanged minus the avatar layer.
vts = [
    "pyvts>=0.3.3",
]
# Live streaming integration: read 弹幕 from Bilibili live rooms and feed
# them as utterances. Optional — without it the "直播" tab is informational only.
danmaku = [
    "bilibili-api-python>=17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livepartner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length handled by formatter
